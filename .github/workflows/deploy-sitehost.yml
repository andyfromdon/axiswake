name: Build and deploy to SiteHost
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sitehost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_AXIS_INDEXING_ENABLED: ${{ github.ref == 'refs/heads/main' && vars.AXIS_INDEXING_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://axisboats.co.nz
          NEXT_PUBLIC_ENQUIRY_ENABLED: ${{ github.ref == 'refs/heads/main' && secrets.AXIS_ENQUIRY_TO != '' && 'true' || 'false' }}
      - run: npm run typecheck
      - run: npm run prepare:release
      - run: npm run test:release
        env:
          SITE_URL: https://axisboats.co.nz
          NEXT_PUBLIC_ENQUIRY_ENABLED: ${{ github.ref == 'refs/heads/main' && secrets.AXIS_ENQUIRY_TO != '' && 'true' || 'false' }}
      - run: npm run test:enquiry
      - run: npm run test:analytics
      - run: tar -C release -czf axis-release.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: axis-release
          path: axis-release.tgz
          retention-days: 7
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SITEHOST_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: demo
      url: https://axis-demo.don.digital
    env:
      SITEHOST_HOST: ${{ secrets.SITEHOST_HOST }}
      SITEHOST_USER: ${{ secrets.SITEHOST_USER }}
      SITEHOST_HOST_KEY_SHA256: ${{ vars.SITEHOST_HOST_KEY_SHA256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: axis-release
      - name: Configure verified SSH
        env:
          SITEHOST_SSH_KEY: ${{ secrets.SITEHOST_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SITEHOST_HOST:?Missing SiteHost host}"
          : "${SITEHOST_USER:?Missing dedicated deployment user}"
          : "${SITEHOST_SSH_KEY:?Missing deployment key}"
          : "${SITEHOST_HOST_KEY_SHA256:?Missing trusted host fingerprint}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SITEHOST_SSH_KEY" > "$HOME/.ssh/sitehost_key"
          chmod 600 "$HOME/.ssh/sitehost_key"
          ssh-keyscan -t ed25519 -H "$SITEHOST_HOST" > "$HOME/.ssh/known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')"
          test "$actual_fingerprint" = "$SITEHOST_HOST_KEY_SHA256"
      - name: Upload checked release
        run: |
          scp -i "$HOME/.ssh/sitehost_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            axis-release.tgz "$SITEHOST_USER@$SITEHOST_HOST:/container/application/.axis-release.tgz"
      - name: Install and restart Axis
        env:
          AXIS_ENQUIRY_TO: ${{ secrets.AXIS_ENQUIRY_TO }}
        run: |
          set -euo pipefail
          if [[ -n "$AXIS_ENQUIRY_TO" && ! "$AXIS_ENQUIRY_TO" =~ ^[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}$ ]]; then
            echo 'AXIS_ENQUIRY_TO must be a single email address.'
            exit 1
          fi
          enquiry_enabled=false
          if [[ -n "$AXIS_ENQUIRY_TO" ]]; then enquiry_enabled=true; fi
          printf 'ENQUIRY_ENABLED=%s\nENQUIRY_TO=%s\nSITE_URL=https://axisboats.co.nz\nENQUIRY_ALLOWED_ORIGINS=https://axisboats.co.nz,https://www.axisboats.co.nz,https://axis-demo.don.digital\n' "$enquiry_enabled" "$AXIS_ENQUIRY_TO" |
          ssh -i "$HOME/.ssh/sitehost_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SITEHOST_USER@$SITEHOST_HOST" \
            'cd /container/application && umask 077 && cat > .axis-runtime.env.new && tar -xzf .axis-release.tgz && mv -f .axis-runtime.env.new .axis-runtime.env && rm -f .axis-release.tgz && supervisorctl -c /container/config/supervisord.conf restart nodejs'
      - name: Verify SiteHost mail connection
        run: |
          ssh -i "$HOME/.ssh/sitehost_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SITEHOST_USER@$SITEHOST_HOST" \
            'cd /container/application && node check-mail.cjs'
      - name: Verify deployed revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_ENQUIRY_STATUS: ${{ secrets.AXIS_ENQUIRY_TO != '' && '400' || '503' }}
          EXPECTED_PUBLIC_INDEXING: ${{ vars.AXIS_INDEXING_ENABLED == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          verify_revision() {
            jq -e --arg revision "$EXPECTED_REVISION" \
              '.status == "ok" and .application == "axis-nz" and .revision == $revision' "$1"
          }
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            --output health.json https://axis-demo.don.digital/api/health
          verify_revision health.json
          curl --fail --silent --show-error https://axis-demo.don.digital/contact | grep -o 'rel="canonical" href="https://axisboats.co.nz/contact"'
          curl --fail --silent --show-error --head https://axis-demo.don.digital/ | grep -i 'x-robots-tag:.*noindex'
          enquiry_status="$(curl --silent --show-error --max-time 20 --output /dev/null \
            --write-out '%{http_code}' --header 'Origin: https://axisboats.co.nz' \
            --header 'Content-Type: application/json' --data '{}' https://axis-demo.don.digital/api/enquiry)"
          if [[ "$enquiry_status" != "$EXPECTED_ENQUIRY_STATUS" ]]; then
            echo "Expected form validation to return HTTP $EXPECTED_ENQUIRY_STATUS, got HTTP $enquiry_status."
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 20 --output public-health.json \
            --write-out '%{http_code}' https://axisboats.co.nz/api/health)"
          case "$status" in
            200)
              verify_revision public-health.json
              curl --fail --silent --show-error --head https://axisboats.co.nz/ > public-headers.txt
              curl --fail --silent --show-error https://axisboats.co.nz/robots.txt > public-robots.txt
              if [[ "$EXPECTED_PUBLIC_INDEXING" == 'true' ]]; then
                if grep -qi 'x-robots-tag:.*noindex' public-headers.txt; then
                  echo 'The public homepage is still marked noindex.'
                  exit 1
                fi
                grep -q '^Sitemap: https://axisboats.co.nz/sitemap.xml' public-robots.txt
              else
                grep -qi 'x-robots-tag:.*noindex' public-headers.txt
                grep -qx 'Disallow: /' public-robots.txt
              fi
              ;;
            403) echo '::warning::axisboats.co.nz returned 403 to the Actions runner. Verify the public domain from a browser.' ;;
            *) echo "Public health check returned HTTP $status."; exit 1 ;;
          esac
